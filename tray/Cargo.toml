[package]
name = "caustics-tray"
version = "0.1.0"
edition.workspace = true
description = "the bar's tray sidecar: StatusNotifierItems and their dbusmenus as one ABI rows frame on stdout, actions back on stdin"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line, the drain every zbus stream is handed to the moment it
# exists (docs/architecture.md, *Rules*), and the icon-theme search
# the fallback chain asks first (`src/icon.rs`).
caustics-sidecar = { path = "../sidecar", features = ["drain", "icons"] }
# The wire, and nothing else about the bar: this binary writes rows frames
# and reads action frames (docs/abi.md, *Rows*, *Action*).
caustics-bar-abi = { path = "../bar/abi" }
# `StreamExt::next` for zbus's signal streams inside `tokio::select!`; zbus
# re-exports only the trait.
futures-lite = "2.6.1"
# dbusmenu `icon-data` is a bare encoded image and real items use two encodings: kdeconnect sends PNG, tailscale sends JPEG.
png = "0.18.1"
# Resampling a pixmap to the square the bar's image slot holds.
# The workspace already carries it through resvg (caustics-apps).
tiny-skia = "0.12.0"
# One current-thread runtime: the watcher, one task per item, its dbusmenu.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
# StatusNotifierWatcher/Item and com.canonical.dbusmenu on the session bus.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zune-jpeg = "0.5.15"

[dev-dependencies]
# The private `dbus-daemon` the deadlock test starts (`tests/drain.rs`).
caustics-sidecar = { path = "../sidecar", features = ["drain", "icons", "test-bus"] }
