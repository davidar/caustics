[package]
name = "caustics-apps"
version = "0.1.0"
edition.workspace = true
description = "the bar's desktop-entry and colour-icon sidecar: an app id or an icon name in on stdin, an ABI App or Pixmap frame out on stdout"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line, one copy for every sidecar, and the
# icon-theme search behind `icons`.
caustics-sidecar = { path = "../sidecar", features = ["icons"] }
# The wire, and the whole of what this binary knows about the bar: it reads
# `Request` frames on stdin and writes `App` and `Pixmap` frames on stdout
# (docs/abi.md, *Request*–*Pixmap*).
caustics-bar-abi = { path = "../bar/abi" }
# A colour SVG or a PNG into the fixed-slot array's own square. The bar
# itself carries no rasteriser at all.
resvg = "0.48.1"
# An `Icon=` that is a JPEG path.
zune-jpeg = "0.5.15"
