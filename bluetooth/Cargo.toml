[package]
name = "caustics-bluetooth"
version = "0.1.0"
edition.workspace = true
description = "the bar's bluetooth sidecar: BlueZ's adapter, its paired devices and, while the menu is open, the devices in range as one ABI rows frame on stdout, actions back on stdin; and BlueZ's pairing agent, asking yes or no on the bar and a typed PIN through the canvas"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line, and the drain every zbus stream is handed to the moment
# it exists (docs/architecture.md, *Rules*).
caustics-sidecar = { path = "../sidecar", features = ["drain"] }
# The wire, and nothing else about the bar: this binary writes rows frames
# and reads action frames (docs/abi.md, *Rows*, *Action*).
caustics-bar-abi = { path = "../bar/abi" }
# One current-thread runtime for the system-bus proxies. A sidecar's executor
# is its own affair; this is the one the other D-Bus sidecars were written for.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
# The copy of a typed PIN this sidecar holds on its way to BlueZ: the sink's
# reply, read into a buffer zeroed when it drops, and the reply itself.
zeroize = "1.9.1"
# BlueZ on the system bus. `tokio` instead of the default `async-io`, so the
# process carries one executor rather than two.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The private `dbus-daemon` the deadlock test starts (`tests/drain.rs`).
caustics-sidecar = { path = "../sidecar", features = ["drain", "test-bus"] }
