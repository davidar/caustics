[workspace]
# The bar process, its ABI crate, its sidecars, and the crates they share. The
# text engine is punchcutter, a dependency.
members = ["apps", "audio", "bar", "bar/abi", "bluetooth", "glyphs", "harness/pointer", "network", "notify", "power", "reload", "sidecar", "sysmon", "tray"]
# The edition-2024 default, stated because it matters here: `bar` depends on
# `punchcutter-core` without features from its build script and with `gpu` from
# its code, and on `punchcutter-slang` with its compiler from its build script
# and its tests and without it from its code. Only resolver 2 or later keeps a
# build script's graph from pulling in wgpu, and the binary's from pulling in
# Slang.
resolver = "3"

# Every member inherits these, so the licence, the edition and the oldest
# toolchain that builds the tree are stated once. The rust-version is the
# highest any dependency declares (wgpu, zbus, zvariant).
[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

# The text engine, one revision for every crate that takes it. A bump is the
# same commit on all five lines, then `cargo fetch`.
[workspace.dependencies]
punchcutter-slang = { git = "https://github.com/davidar/punchcutter", rev = "c8e27b452ea44b7600c3425a2f7585d9a13ec4de" }
punchcutter-core = { git = "https://github.com/davidar/punchcutter", rev = "c8e27b452ea44b7600c3425a2f7585d9a13ec4de" }
punchcutter-fonts = { git = "https://github.com/davidar/punchcutter", rev = "c8e27b452ea44b7600c3425a2f7585d9a13ec4de" }
punchcutter-shape = { git = "https://github.com/davidar/punchcutter", rev = "c8e27b452ea44b7600c3425a2f7585d9a13ec4de" }
punchcutter-text = { git = "https://github.com/davidar/punchcutter", rev = "c8e27b452ea44b7600c3425a2f7585d9a13ec4de" }

[profile.dev]
# The debug build is what the tests, the oracle and the nested gate run, so it
# gets the cheap optimisations: a little compile time for a usable bar.
opt-level = 1
