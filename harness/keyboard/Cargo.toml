[package]
name = "caustics-keyboard"
version = "0.1.0"
edition.workspace = true
description = "The nested gate's keyboard: typed text and named keys through zwp_virtual_keyboard_v1 (docs/testing.md, *The nested gate*). A harness tool, not a sidecar."
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "caustics-keyboard"
path = "src/main.rs"

[dependencies]
# The pure-Rust backend, as caustics-pointer's: a short-lived client.
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
