[package]
name = "caustics-power"
version = "0.1.0"
edition.workspace = true
description = "the bar's power sidecar: UPower's battery and logind's power menu as one ABI rows frame on stdout, actions back on stdin"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line, and the drain every zbus stream is handed to the moment
# it exists (docs/architecture.md, *Rules*).
caustics-sidecar = { path = "../sidecar", features = ["drain"] }
# The wire, and nothing else about the bar: this binary writes rows frames
# and reads action frames (docs/abi.md, *Rows*, *Action*).
caustics-bar-abi = { path = "../bar/abi" }
# One current-thread runtime for the two system-bus proxies. A sidecar's
# executor is its own affair; current-thread tokio, as in the other D-Bus sidecars.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
# The kernel's uevent socket, opened by hand (`src/uevent.rs`): one netlink
# socket is three calls, and a netlink crate or libudev would be more to carry
# than the socket itself.
libc = "0.2.189"
# UPower and logind on the system bus. `tokio` instead of the default
# `async-io`, so the process carries one executor rather than two.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The private `dbus-daemon` the deadlock test starts (`tests/drain.rs`).
caustics-sidecar = { path = "../sidecar", features = ["drain", "test-bus"] }
