[package]
name = "caustics-host"
version = "0.1.0"
edition.workspace = true
description = "The mechanism a program needs to host a caustic: a Vulkan device, a Slang program loaded as SPIR-V with reflection-driven bind groups, the hot-reload swap, and a supervisor for sidecar processes"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The contracts: the wire a sidecar writes and the buffer constants a host
# sizes its CPU-side tables by. Nothing here declares a layout of its own.
caustics-bar-abi = { path = "../bar/abi" }
# The reflection's types and their JSON form, and nothing else: a host reads
# the reflection baked beside its SPIR-V and the one each reload carries, and
# never compiles. Without the default `compiler` feature nothing here links
# Slang.
punchcutter-slang = { workspace = true, default-features = false }
# The engine's wgpu helpers (`gpu`): the device with the shader clock, the
# passthrough pipeline, and the `Plain` byte views the mirror is read into.
punchcutter-core = { workspace = true, features = ["gpu"] }
pollster = "0.4"
raw-window-handle = "0.6.2"
wgpu = "30.0.0"
anyhow = "1.0.104"
# `sysconf` for the `/proc` reader's tick and page sizes.
libc = "0.2.189"
tracing = "0.1.44"
# The shaper's buffer layouts (`ShapeParams`, `ShapeFont`, the arena's
# front block) for the engine's buffers a host holds (`text`).
punchcutter-shape.workspace = true
# An `Answer` frame's bytes are serialised into a zeroing buffer (`pipe`).
zeroize = "1.9.1"

[dev-dependencies]
# The pipeline-timing example's log lines (`examples/pipeline_times.rs`).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
