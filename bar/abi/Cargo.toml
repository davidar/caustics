[package]
name = "caustics-bar-abi"
version = "0.1.0"
edition.workspace = true
description = "The bar's ABI as a crate: the byte-exact buffer layouts the embassy, the caustic and every sidecar share, and the wire format a sidecar writes to the bar"
license.workspace = true
rust-version.workspace = true

[dependencies]
# `Plain`, the byte views and the declare-once macros, and nothing else:
# featureless `punchcutter-core` is std-only, which is what lets a sidecar with
# no GPU, no Wayland and no tokio depend on this crate.
punchcutter-core.workspace = true

[build-dependencies]
# `modules::SHAPE_ABI`: the engine's `shape_abi.slang` as compiled into the
# engine, one of the four inputs the ABI hash covers.
punchcutter-core.workspace = true
