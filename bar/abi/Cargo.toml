[package]
name = "caustics-bar-abi"
version = "0.1.0"
edition.workspace = true
description = "The bar's ABI as a crate: the byte-exact buffer layouts the embassy, the caustic and every sidecar share, and the wire format a sidecar writes to the bar"
license.workspace = true
rust-version.workspace = true

# The generator (docs/abi.md, *The two contracts*): `cargo run -p caustics-bar-abi --bin
# gen-slang` writes `caustics/bar_abi.slang` and `caustics/bar_wire.slang` from
# the declarations. Spelled out because the hyphen is the command's.
[[bin]]
name = "gen-slang"
path = "src/bin/gen_slang.rs"

[dependencies]
# `Plain`, the byte views and the declare-once macros, and nothing else:
# featureless `punchcutter-core` is std-only, which is what lets a sidecar with
# no GPU, no Wayland and no tokio depend on this crate.
punchcutter-core.workspace = true

[build-dependencies]
# `slang_dir()`: where the engine's `shape_abi.slang` is, one of the five files
# the ABI hash covers.
punchcutter-core.workspace = true
