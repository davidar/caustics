[package]
name = "caustics-bar"
version = "0.1.0"
edition.workspace = true
description = "A Wayland status bar whose layout, text and drawing run in Slang compute shaders on the GPU; a layer-shell client, run on niri"
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
# The clock's local-time offset (tzset/localtime_r). Already in Cargo.lock via
# wgpu's tree, so this costs no new crate and no registry fetch.
libc = "0.2.189"
# The slangc driver, the `Plain` byte views, the mtime watch and the wgpu
# helpers, shared with `caustics-reload` and the test harnesses.
caustics-core = { path = "../core", features = ["gpu"] }
# The ABI as a crate (docs/abi.md, *Writing a sidecar*), so a sidecar can import the
# declarations without any of the above.
caustics-bar-abi = { path = "abi" }
# `ShapeParams` and `MAX_RUN_GLYPHS`: the layout of the buffer `caustics-glyphs` sends as `BUF_SHAPE_FONT`, and the cap on a run's glyph slots. The
# *tables* are `caustics-glyphs`'s and reach this process as bytes.
#
# No `caustics-text` here: the bar holds no curves, parses no font and caches
# nothing about one. It is a dev-dependency below, for one layout test.
caustics-shape = { path = "../shape" }
pollster = "0.4"
raw-window-handle = "0.6.2"
# niri's IPC is line-delimited JSON. The feeder writes requests with `json!`
# and walks replies as `Value` rather than depending on the `niri-ipc` crate,
# which would pin the bar to niri's release cadence for a dozen wire shapes.
serde_json = "1.0.151"
# No xkbcommon: the bar takes no keyboard (its surface asks for no keyboard
# interactivity), and the feature would link libxkbcommon for nothing.
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `system` exposes `Backend::display_ptr` and `ObjectId::as_ptr`, which is the
# only way to hand a `wl_surface` to wgpu as a raw window handle (the sctk
# wgpu example's dance). It links libwayland-client, so building needs its
# development symlink (`libwayland-client.so`).
wayland-client = { version = "0.31.15", features = ["system"] }
wgpu = "30.0.0"
# No zbus, tokio, image decoders: the tray, the battery and the power menu are
# sidecars (`caustics-tray`, `caustics-power`), so the bar process knows Wayland, the
# compositor's IPC socket and pipes, and carries no async executor at all —
# the embassy is calloop, start to finish (docs/architecture.md, *The bar process*).
#
# No shaper or rasteriser: text is shaped and filled by the caustic from the
# font's own tables and curves (docs/architecture.md, *Text*). The reference
# implementations it is checked against are dev-dependencies of `shape/` and
# `text/`.
#
# No SVG renderer or icon-theme lookup: desktop entries and icon themes are
# `caustics-apps`'s. A colour icon arrives as one slot of straight RGBA8 over a
# pipe; the bar copies the bytes and the caustic multiplies them by their own
# alpha.
# build.rs bakes the caustic through the same driver the reload loop uses.
# Featureless: nothing in a build script needs wgpu.
[build-dependencies]
caustics-core = { path = "../core" }

[dev-dependencies]
# The ABI layout test parses slangc's reflection JSON through
# `caustics_core::slang::struct_offsets`.
caustics-core = { path = "../core" }
# The oracle's font: the arena and the curve buffers the bar's own `caustics-glyphs` sends over the pipe, built
# in-process so a headless test shapes against a real font rather than an empty
# arena. A path dependency already in the lockfile, and the bar's *binary*
# links none of it.
caustics-glyphs = { path = "../glyphs" }
# For one test: `bar/src/abi/tests.rs` checks `caustics_text::Glyph`'s field offsets
# against `caustics/text.slang`'s reflection, and that check has to live where
# slangc and the baked reflection are. The bar's *binary* links none of this.
caustics-text = { path = "../text" }
