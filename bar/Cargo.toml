[package]
name = "caustics-bar"
version = "0.1.0"
edition.workspace = true
description = "A Wayland status bar whose layout, text and drawing run in Slang compute shaders on the GPU; a layer-shell client, run on niri"
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
# The clock's local-time offset (tzset/localtime_r). Already in Cargo.lock via
# wgpu's tree, so this costs no new crate and no registry fetch.
libc = "0.2.189"
# The `Plain` byte views and the wgpu helpers (`gpu`: the device with the
# shader clock, pipelines, buffers).
punchcutter-core = { workspace = true, features = ["gpu"] }
# The reflection's types and their JSON form, and nothing else: the bar reads
# the reflection baked beside its SPIR-V and the one each reload carries, and
# never compiles. Without the default `compiler` feature the binary links no
# Slang (the oracle and the tests take it, below).
punchcutter-slang = { workspace = true, default-features = false }
# The ABI as a crate (docs/abi.md, *Writing a sidecar*), so a sidecar can import the
# declarations without any of the above.
caustics-bar-abi = { path = "abi" }
# `ShapeParams` and `MAX_RUN_GLYPHS`: the layout of the buffer `caustics-glyphs`
# sends as `BUF_SHAPE_FONT`, and the cap on a run's glyph slots. The *tables*
# are `caustics-glyphs`'s and reach this process as bytes.
#
# No `punchcutter-text` or `punchcutter-fonts` here: the bar holds no curves,
# parses no font and caches nothing about one. They are dev-dependencies below.
punchcutter-shape.workspace = true
pollster = "0.4"
raw-window-handle = "0.6.2"
# niri's IPC is line-delimited JSON. The feeder writes requests with `json!`
# and walks replies as `Value` rather than depending on the `niri-ipc` crate,
# which would pin the bar to niri's release cadence for a dozen wire shapes.
serde_json = "1.0.151"
# No xkbcommon: the bar takes no keyboard (its surface asks for no keyboard
# interactivity), and the feature would link libxkbcommon for nothing.
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `system` exposes `Backend::display_ptr` and `ObjectId::as_ptr`, which is the
# only way to hand a `wl_surface` to wgpu as a raw window handle (the sctk
# wgpu example's dance). wgpu-hal turns on wayland-sys's `dlopen`, so
# libwayland-client is loaded by name when the bar starts and nothing links
# against it: building needs no development symlink.
wayland-client = { version = "0.31.15", features = ["system"] }
wgpu = "30.0.0"
# No zbus, tokio, image decoders: the tray, the battery and the power menu are
# sidecars (`caustics-tray`, `caustics-power`), so the bar process knows Wayland, the
# compositor's IPC socket and pipes, and carries no async executor at all —
# the embassy is calloop, start to finish (docs/architecture.md, *The bar process*).
#
# No shaper or rasteriser: text is shaped and filled by the caustic from the
# font's own tables and curves (docs/architecture.md, *Text*), through
# punchcutter's Slang modules. The reference implementations it is checked
# against are punchcutter's.
#
# No SVG renderer or icon-theme lookup: desktop entries and icon themes are
# `caustics-apps`'s. A colour icon arrives as one slot of straight RGBA8 over a
# pipe; the bar copies the bytes and the caustic multiplies them by their own
# alpha.
# build.rs bakes the caustic through the same in-process compiler the reload
# loop uses; the engine's modules are on its search path by itself. Nothing in
# a build script needs wgpu.
[build-dependencies]
punchcutter-slang.workspace = true
# `ENTRIES` and `DstFormat`: which entry points to bake, and for which
# swapchain formats, from the same crate `caustics-reload` reads them from; and
# `write_rendered`, the bar's two rendered modules, on the include path too.
caustics-bar-abi = { path = "abi" }

[dev-dependencies]
# The oracle's font: the arena and the curve buffers the bar's own
# `caustics-glyphs` sends over the pipe, built in-process so a headless test
# shapes against a real font rather than an empty arena. The bar's *binary*
# links none of it.
caustics-glyphs = { path = "../glyphs" }
punchcutter-fonts.workspace = true
# For one test: `bar/src/abi/tests.rs` checks `punchcutter_text::Glyph`'s field
# offsets against the reflection of the bar's own compile. The bar's *binary*
# links none of this.
punchcutter-text.workspace = true
# The compiler, for the tests and the oracle, which compile the caustic in
# process (the oracle's `bar_check` entry point is in no baked module).
punchcutter-slang.workspace = true
