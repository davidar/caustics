# caustics-bar on the integrated GPU only, for a machine with a discrete GPU
# beside it (a hybrid laptop). Install it with
#
#   bar/install.sh --dropin bar/systemd/dropins/igpu-only.conf
#
# which copies it to ~/.config/systemd/user/caustics-bar.service.d/.
#
# Why: a status bar runs for the whole session, and a discrete GPU that is
# woken to draw it stays awake, which costs a laptop hours of battery. The
# bar already prefers a low-power adapter and refuses one named NVIDIA
# (bar/src/gpu.rs), but by then the Vulkan loader has loaded every
# installed driver and enumerated every device, and enumeration alone can
# power the discrete GPU up. Pinning the loader to the integrated GPU's
# driver means the discrete one is never opened at all.
#
# The line below names Mesa's RADV driver, for an AMD integrated GPU. On an
# Intel one, use intel_icd.x86_64.json; `ls /usr/share/vulkan/icd.d/` lists
# what is installed.
[Service]
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
