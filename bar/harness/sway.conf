# The headless host of the nested gate (docs/testing.md, *The nested
# gate*): sway in the `caustics-headless` toolbox with WLR_BACKENDS=headless,
# holding one window — the nested niri's winit window — and nothing else.
# Started by bar/nested-run.sh with this file and no other config.

# One output at the VM's size. Scale 1, so the window's logical size is its
# physical size and the nested niri's `winit` output is exactly 1280x800.
output HEADLESS-1 resolution 1280x800 position 0,0 scale 1

# The one window fills the output to the pixel: no title bar, no border, no
# gaps, so the nested output is the whole 1280x800 and not 1276x776.
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
titlebar_border_thickness 0
titlebar_padding 1

# Nobody types into a headless output, and nothing here should start a
# process the harness does not track: no bar, no binds, no exec.
focus_follows_mouse no

# No X server: a nested Xwayland is one more process the harness would have
# to track, and it cannot claim /tmp/.X11-unix from inside the toolbox anyway.
xwayland disable
