[package]
name = "caustics-secrets"
version = "0.1.0"
edition.workspace = true
description = "The canvas's NetworkManager secret agent: a request for a network's password turned into a prompt conversation over the wire, and the answer handed to NetworkManager alone"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "caustics-secrets"
path = "src/main.rs"

[dependencies]
# The wire: `Hello` and `Prompt` out, `Answer` in (docs/abi.md, *Prompt*,
# *Answer*).
caustics-bar-abi = { path = "../bar/abi" }
# The witness line, and the drain the one signal stream this agent subscribes
# to (NetworkManager's name changing hands) goes to the moment it exists
# (docs/architecture.md, *Rules*).
caustics-sidecar = { path = "../sidecar", features = ["drain"] }
# One current-thread runtime for the bus, as the other D-Bus sidecars.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
# The reply's copy of what was typed, zeroed when the reply has been sent.
zeroize = "1.9.1"
# The agent object and NetworkManager's agent manager. `tokio` instead of the
# default `async-io`, so the process carries one executor rather than two.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The private `dbus-daemon` the agent's bus test runs against.
caustics-sidecar = { path = "../sidecar", features = ["drain", "test-bus"] }
