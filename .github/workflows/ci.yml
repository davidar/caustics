# What a hosted runner can check: the build with warnings as errors, every
# unit and integration test, the oracle on Mesa's software Vulkan, the link
# check and the scrub check. The nested gate (docs/testing.md) needs a
# compositor and a GPU and stays the local merge gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # libwayland at link time; fontconfig and sans-serif fonts for the text
      # tests (they skip without one; Noto Sans lacks the chart arrows, DejaVu
      # Sans has them); lavapipe for the oracle; spirv-val, which every
      # compile runs over its modules when it is installed; dbus-daemon for
      # the sidecars' private test buses.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            fontconfig fonts-noto-core fonts-dejavu-core \
            mesa-vulkan-drivers libvulkan1 spirv-tools \
            dbus

      # The Slang compiler is in process (punchcutter-slang). Its release is
      # downloaded by the `shader-slang-sys` build script on a first build,
      # pinned and checked against its SHA-256, and kept under
      # ~/.cache/shader-slang/; caching that directory spares every run the
      # download. Cargo.lock pins the crate, and with it the release.
      - name: Slang release
        uses: actions/cache@v4
        with:
          path: ~/.cache/shader-slang
          key: shader-slang-${{ hashFiles('Cargo.lock') }}
          restore-keys: shader-slang-

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check, with warnings as errors
        run: cargo check --workspace --all-targets --locked

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: The oracle, on lavapipe
        env:
          CAUSTICS_BAR_ORACLE: "1"
        run: cargo test -p caustics-bar --locked oracle -- --nocapture

      - name: Links and scrub
        run: |
          docs/check-links.sh
          tools/scrub-check.sh ':!LICENSE'
