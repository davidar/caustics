[package]
name = "caustics-pairing"
version = "0.1.0"
edition.workspace = true
description = "The canvas's pairing sink: a Bluetooth PIN or passkey that must be typed, asked by the bar's Bluetooth sidecar over a socket, turned into a prompt conversation over the wire, and the answer handed back on the socket alone"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "caustics-pairing"
path = "src/main.rs"

[dependencies]
# The wire: `Hello` and `Prompt` out, `Answer` in (docs/abi.md, *Prompt*,
# *Answer*).
caustics-bar-abi = { path = "../bar/abi" }
# The witness line.
caustics-sidecar = { path = "../sidecar" }
# The reply line's copy of a typed PIN or passkey, zeroed when it has been
# written to the socket.
zeroize = "1.9.1"
