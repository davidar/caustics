[package]
name = "caustics-glyphs"
version = "0.1.0"
edition.workspace = true
description = "the bar's curves sidecar: a font and every symbolic icon turned into the caustic's six text buffers on stdout, so the bar links no font parser"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line, one copy for every sidecar, and the icon-theme search
# behind `icons`, shared with caustics-apps and caustics-tray.
caustics-sidecar = { path = "../sidecar", features = ["icons"] }
# The wire, and the whole of what this binary knows about the bar: it writes
# `Bytes` runs for the six `BUF_*` buffers and answers a `Request`.
caustics-bar-abi = { path = "../bar/abi" }
# The font: found through fontconfig, turned into curves and band tables (the
# band search, most of a cold load, happens in this process, not the bar's),
# its arena sliced out, and the fallback faces a cover opens.
punchcutter-fonts.workspace = true
# Icons as curves into the same buffers (`icon::load_file`, `Builder`), and the
# glyph record's stride.
punchcutter-text.workspace = true
# The arena's front block, which a cover resends (`OT_TABLES_START`).
punchcutter-shape.workspace = true
# The engine reports through `tracing`; this process turns each event into a
# witness line, so a cover says what it did in the bar's journal.
tracing = "0.1"
tracing-subscriber = "0.3"
