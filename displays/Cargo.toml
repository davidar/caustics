[package]
name = "caustics-displays"
version = "0.1.0"
edition.workspace = true
description = "the bar's displays sidecar: niri's outputs as one ABI rows frame on stdout, and on/off, scale, mode and rotation back over niri's IPC socket"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The witness line (docs/abi.md, *Writing a sidecar*). No features: this
# sidecar has no bus and no async runtime.
caustics-sidecar = { path = "../sidecar" }
# The wire, and nothing else about the bar: this binary writes rows frames
# and reads action frames (docs/abi.md, *Rows*, *Action*).
caustics-bar-abi = { path = "../bar/abi" }
# niri's `Outputs` reply is a map of nested objects, and an output's name goes
# into a request as a JSON string: read and written as `serde_json::Value`, so
# no derive and no copy of niri's IPC types.
serde_json = "1.0.151"
