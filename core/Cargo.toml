[package]
name = "caustics-core"
version = "0.1.0"
edition.workspace = true
description = "The machinery around a caustic: the slangc driver, plain-bytes views, the mtime watch, the declare-once ABI renderer and the wgpu helpers"
license.workspace = true
rust-version.workspace = true

[dependencies]
# Two macros in the slangc driver, five in the GPU helpers. The crate is
# otherwise std-only, which is what lets a build script depend on it.
tracing = "0.1"
# Only the `gpu` feature's helpers touch wgpu, so a build script can depend on
# this crate without dragging the graphics stack into the build graph.
wgpu = { version = "30", optional = true }
# Vulkan's own types, for the one thing wgpu cannot ask for on its own:
# `VK_KHR_shader_clock`, which is what lets the shaper hold a wall-clock
# deadline inside the kernel, so a pathological font cannot hold the GPU past it.
# Reached through wgpu-hal's device-creation callback, so the version is
# wgpu-hal 30's own.
ash = { version = "0.38.0", optional = true }
# Every compile carries slangc's `getStringHash` table (the caustic's strings
# by hash), so the bar parses reflection JSON on every reload and the parser
# has to be there unconditionally.
serde_json = "1"
# `request_device` is a future and this crate is not async; the same 0.4 the
# bar and the harness already block on.
pollster = { version = "0.4", optional = true }

[features]
default = []
# The wgpu-typed helpers: pipelines, id textures, storage buffers, acquire.
gpu = ["dep:wgpu", "dep:ash", "dep:pollster"]
